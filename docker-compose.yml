x-app: &app
  build:
    context: .
    args:
      VITE_DEMO: ${VITE_DEMO:-true}
  image: securedocs-monolito
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &entorno
    SPRING_PROFILES_ACTIVE: demo
    DB_URL: jdbc:mysql://host.docker.internal:3306/securedocs
    DB_USER: ${DB_USER:?Definir DB_USER en .env}
    DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
    JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET en .env}
    SEED_PASSWORD: ${SEED_PASSWORD:-Secure#2026}
    SECUREDOCS_PROXY_CONFIABLE: "true"
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8080/api/actuator/health"]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 40s
  restart: unless-stopped

services:
  app1:
    <<: *app
    container_name: app1
    environment:
      <<: *entorno
      INSTANCE_NAME: app1
    ports:
      - "8081:8080"

  app2:
    <<: *app
    container_name: app2
    environment:
      <<: *entorno
      INSTANCE_NAME: app2
    ports:
      - "8082:8080"

  app3:
    <<: *app
    container_name: app3
    environment:
      <<: *entorno
      INSTANCE_NAME: app3
    ports:
      - "8083:8080"
